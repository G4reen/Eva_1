name: CI/CD Microservicio Vehiculos

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-vehiculos
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - name: Give execute permission to mvnw
      run: chmod +x mvnw
    - name: Build with Maven
      run: ./mvnw clean install
      #